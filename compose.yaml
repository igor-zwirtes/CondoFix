services:
  postgres:
    image: postgres:17
    container_name: manutencao-postgres
    environment:
      POSTGRES_DB: manutencao
      POSTGRES_USER: manutencao_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manutencao_user -d manutencao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: